server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }

    location /exercises {
        proxy_pass http://backend:5000/exercises;
    }

    location /workouts {
        proxy_pass http://backend:5000/workouts;
    }

    location /auth {
        proxy_pass http://backend:5000/auth;
    }

    location /templates {
        proxy_pass http://backend:5000/templates;
    }
}
