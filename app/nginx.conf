server {
    listen 80;
    server_name lifeflowfitness.se www.lifeflowfitness.se;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://backend:5000/;
    }
}

