server {
    listen 80;
    server_name lifeflowfitness.se www.lifeflowfitness.se;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name lifeflowfitness.se www.lifeflowfitness.se;

    ssl_certificate /etc/letsencrypt/live/lifeflowfitness.se/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lifeflowfitness.se/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://backend:5000/;
    }
}
