default:
  artifacts:
    expire_in: 1 day

stages:
  - install
  - lint
  - test
  - build
  - deploy

image: node:22-alpine

cache:
  key:
    files:
      - app/package-lock.json
  paths:
    - app/.npm/

install:
  stage: install

  script:
    - cd app
    - npm ci --cache .npm --prefer-offline

  artifacts:
    paths:
      - app/node_modules/

lint:
  stage: lint

  dependencies:
    - install

  script:
    - cd app
    - npm run lint

test:
  stage: test

  dependencies:
    - install

  script:
    - cd app
    - CI=false npm test -- --watchAll=false

build:
  stage: build

  dependencies:
    - install

  script:
    - cd app
    - CI=false npm run build
    
trigger-deploy:
  stage: deploy

  needs:
    - lint
    - test
    - build

  trigger:
    project: 1dv613/student/sa226jf/workspace/lifeflow-deploy
    branch: main

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
