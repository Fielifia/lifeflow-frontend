stages:
  - install
  - lint
  - test
  - build
  - deploy

image: node:22

default:
  before_script:
    - cd my-app

install:
  stage: install
  script:
    - npm ci
  artifacts:
    paths:
      - my-app/node_modules/

lint:
  stage: lint
  dependencies:
    - install
  script:
    - npm run lint

test:
  stage: test
  dependencies:
    - install
  script:
    - npm test -- --watchAll=false

build:
  stage: build
  dependencies:
    - install
  script:
    - CI=false npm run build

deploy:
  stage: deploy
  before_script:
    - apt-get update -y && apt-get install -y openssh-client
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

  script:
    - ssh ubuntu@cu0039.camp.lnu.se "
        cd ~/lifeflow &&
        cd lifeflow-backend && git pull &&
        cd ../lifeflow-frontend && git pull &&
        cd ../lifeflow-deploy &&
        docker compose up -d --build
      "
  when: manual
