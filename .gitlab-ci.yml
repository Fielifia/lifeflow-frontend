stages:
  - install
  - lint
  - test
  - build
  - deploy

image: node:22

install:
  stage: install
  script:
    - cd app
    - npm ci

  artifacts:
    paths:
      - app/node_modules/

lint:
  stage: lint

  dependencies:
    - install

  script:
    - cd app
    - npm run lint

test:
  stage: test

  dependencies:
    - install

  script:
    - cd app
    - npm test -- --watchAll=false

build:
  stage: build

  dependencies:
    - install

  script:
    - cd app
    - CI=false npm run build

trigger-deploy:
  stage: deploy

  trigger:
    project: 1dv613/student/sa226jf/workspace/lifeflow-deploy
    branch: main
